# Runtime settings for Raspberry Pi and desktop deployments.
runtime:
  max_width: 1280
  jpeg_quality: 90
  camera_warmup_frames: 8
detection:
  # Leaf detection: HSV + ExG + CGI multi-signal fusion.
  leaf_hue: [30, 95]
  leaf_saturation_min: 35
  leaf_value_min: 25
  leaf_min_area: 350
  leaf_max_area: 30000
  leaf_min_aspect: 1.0
  leaf_max_aspect: 12.0
  leaf_min_solidity: 0.58
  excess_green_min: 12
  # Fruit detection: yellow-green + ripe purple + dark ripe + watershed split.
  fruit_hue_yellow: [18, 45]
  fruit_hue_ripe: [105, 179]
  fruit_saturation_min: 55
  fruit_value_min: 65
  fruit_lab_b_min: 145
  fruit_min_area: 250
  fruit_max_area: 18000
  fruit_min_aspect: 0.45
  fruit_max_aspect: 2.4
  fruit_min_circularity: 0.50
  fruit_min_solidity: 0.72
  fruit_max_ellipse_ratio: 3.5
  fruit_max_internal_std: 40.0
  fruit_no_circle_min_area: 1400
  fruit_no_circle_min_circularity: 0.65
  fruit_no_circle_min_solidity: 0.88
  fruit_no_circle_max_std: 45.0
  fruit_no_circle_max_area: 4000
  # Advanced detection parameters.
  adaptive_blur: 5
  multiscale_scales: [0.75, 1.0, 1.3]
  watershed_mindist: 20
  deblur_min_blur_raw: 5.0
  edge_close_kernel: 5
  grabcut_iter: 3
  edge_refine: true
  detect_mode: multi_signal
  fg_kmeans_clusters: 3
  fg_grabcut_iter: 5
  fg_min_area_ratio: 0.005
  fg_morph_kernel: 7
  # Wrinkle scoring thresholds and formula parameters.
  wrinkle_ridge_weight: 3.0
  wrinkle_texture_base: 18.0
  wrinkle_texture_scale: 80.0
  wrinkle_smooth_max: 0.25
  wrinkle_slightly_wrinkled_max: 0.45
  wrinkle_wrinkled_max: 0.70
  wrinkle_erosion_scale: 0.25
  wrinkle_min_interior_pixels: 60
  wrinkle_min_valid_pixels: 30
  wrinkle_ridge_mean_multiplier: 1.4
  wrinkle_ridge_min_threshold: 20.0
  wrinkle_interior_fraction_min: 0.30
  wrinkle_min_reliable_area: 350
  # Leaf curl scoring.
  curl_weight_solidity: 0.30
  curl_weight_defect: 0.30
  curl_weight_elongation: 0.40
  curl_defect_radius_scale: 0.5
  curl_elongation_baseline: 1.2
  curl_elongation_scale: 4.0
  curl_threshold_flat: 0.10
  curl_threshold_slight: 0.25
  curl_threshold_curled: 0.50
  # QR code tree-id detection (第N試験樹). Set false to skip QR scanning.
  qr_detection: true
analysis:
  # Leaf colour hue bands (OpenCV H scale 0-179).
  leaf_hue_green_low: 35
  leaf_hue_green_high: 85
  leaf_hue_yellow_high: 95
  leaf_hue_dark_high: 150
  # Leaf size distribution buckets (px^2).
  leaf_size_small_max: 2000
  leaf_size_medium_max: 6000
  # Drooping angle thresholds (degrees from horizontal).
  drooping_angle_low: 45
  drooping_angle_high: 135
  # Confidence threshold for "low confidence" leaf counting.
  leaf_low_confidence_threshold: 0.5
  # Fruit size distribution buckets (px^2).
  fruit_size_small_max: 400
  fruit_size_medium_max: 800
  fruit_low_confidence_threshold: 0.5
stress:
  # Water stress = weight_curl * curl + weight_wrinkle * wrinkle.
  weight_curl: 0.5
  weight_wrinkle: 0.5
  # Overall health score normalisation thresholds.
  green_coverage_max: 50.0
  curl_saturation: 3.0
  wrinkle_saturation: 2.0
  saturation_max: 120.0
  # Overall health score weights (must sum to 1.0).
  weight_green: 0.30
  weight_health_curl: 0.25
  weight_health_wrinkle: 0.25
  weight_saturation: 0.20
trend:
  # Minimum green coverage (%) for an observation to be included.
  min_green_coverage: 10.0
  # Dehydration scoring: d_wrk/scale * w_wrk + (1-shrink) * w_shrink.
  dehydration_wrinkle_scale: 0.5
  dehydration_wrinkle_weight: 0.6
  dehydration_shrink_weight: 0.4
  # Per-fruit track flag thresholds (change since last observation).
  flag_ripeness_threshold: 0.15
  flag_wrinkle_threshold: 0.2
  flag_dehydration_threshold: 0.30
  # Trend note thresholds (per-day linear slopes).
  note_ripeness_rise: 0.05
  note_ripeness_fall: -0.05
  note_wrinkle_increase: 0.05
  note_green_decline: -2.0
  note_fruit_count_decline: -0.5
  note_leaf_count_decline: -1.0
  # Dropout detection: max green-coverage change when detecting false drops.
  dropout_green_tolerance: 1.0
video:
  frame_interval: 10
  max_frames: 500
  output_fps: 5
  track_max_age: 30
  track_iou_threshold: 0.3

# Resolution-adaptive presets for drone/aerial images.
# Parameters are scaled relative to the base resolution (1280px).
# Scale factor = actual_width / base_resolution
# Areas scale by factor^2, lengths by factor.
resolution_presets:
  base_resolution: 1280
  # Low-res threshold: images below this width use scaled params
  low_res_threshold: 900
  # Scale factors for area-based parameters (applied as multiplier)
  low_res:
    leaf_min_area: 0.35       # 350 -> ~122 for 720p
    leaf_max_area: 0.40       # 30000 -> ~12000
    fruit_min_area: 0.35      # 250 -> ~87
    fruit_max_area: 0.40      # 18000 -> ~7200
    fruit_no_circle_min_area: 0.35
    fruit_no_circle_max_area: 0.40
    wrinkle_min_reliable_area: 0.35
    leaf_min_solidity: 0.90   # slightly stricter for noisy low-res
    fruit_min_solidity: 0.90
    fruit_min_circularity: 0.55
    watershed_mindist: 0.6    # 20 -> ~12
    multiscale_scales: [0.85, 1.0, 1.15]  # tighter scale range
    fg_min_area_ratio: 0.008
  # Very low-res (480p and below)
  very_low_res:
    leaf_min_area: 0.20
    leaf_max_area: 0.25
    fruit_min_area: 0.20
    fruit_max_area: 0.25
    fruit_no_circle_min_area: 0.20
    fruit_no_circle_max_area: 0.25
    wrinkle_min_reliable_area: 0.20
    leaf_min_solidity: 0.92
    fruit_min_solidity: 0.92
    fruit_min_circularity: 0.60
    watershed_mindist: 0.5
    multiscale_scales: [0.9, 1.0, 1.1]
    fg_min_area_ratio: 0.01
