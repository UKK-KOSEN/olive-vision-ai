documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

src:
  - changed-files:
      - any-glob-to-any-file:
          - src/**

config:
  - changed-files:
      - any-glob-to-any-file:
          - config/**
