# Labels for PRs
# https://github.com/actions/labeler

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'SECURITY.md'
          - 'bandit*'
          - '**/*security*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - 'README*'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - '**/*test*'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements*.txt'
          - 'setup.py'
          - 'setup.cfg'
          - 'pyproject.toml'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'olivevision.py'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/**'

soil-moisture:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/soil_moisture.py'
          - 'config/soil_moisture.yaml'
          - 'tests/test_soil_moisture.py'
          - 'docs/SOIL_MOISTURE_GUIDE.md'

feature:
  - head-branch:
      - '/^feat/'
      - '/^feature/'
      - '/^add/'

fix:
  - head-branch:
      - '/^fix/'
      - '/^bugfix/'
      - '/^hotfix/'

chore:
  - head-branch:
      - '/^chore/'
      - '/^ci/'
      - '/^build/'
