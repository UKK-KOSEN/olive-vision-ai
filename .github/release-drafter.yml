name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
      - "feat"
  - title: "Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "bug"
  - title: "Security"
    labels:
      - "security"
      - "dependency"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "Maintenance"
    labels:
      - "chore"
      - "maintenance"
      - "refactor"
      - "test"
      - "ci"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
no-changes-template: "No changes since last release."

version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bugfix"
      - "bug"
      - "security"
      - "dependency"
  default: patch

autolabeler:
  - label: "feature"
    title:
      - '/^feat/i'
  - label: "fix"
    title:
      - '/^fix/i'
  - label: "security"
    title:
      - '/^security/i'
    branch:
      - '/dependabot/i'
  - label: "documentation"
    title:
      - '/^docs/i'
  - label: "chore"
    title:
      - '/^chore/i'

exclude-labels:
  - "skip-changelog"

sort-by: "title"
sort-order: "asc"
